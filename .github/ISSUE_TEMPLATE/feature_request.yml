name: 功能请求
description: 提议 Reflect-TUI 的新功能或改进
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      content: |
        提议新功能时,请先确认它属于 Reflect-TUI(表现层)职责,
        而不是 Reflect-Agent(核心引擎)职责。核心引擎的改进请到
        https://github.com/Asketisch/Reflect-Agent 提 issue。

  - type: textarea
    id: motivation
    attributes:
      label: 想解决的问题 / 用例
      description: '你目前的工作流是什么?缺什么会让它更顺畅?'
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提议方案
      description: '你期望的 UI / 命令 / 行为是什么样的?画 ASCII 草图或贴 mockup 也欢迎'
      placeholder: |
        例:`/theme` 新增 `<theme> set accent <color>` 子命令
        例:`/loop` 支持 cron 表达式(`/loop "*/5 * * * *" <cmd>`)
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: '是否考虑过其他实现方式?取舍是什么?'
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 范围 / 影响面
      description: '是否需要新增依赖?是否涉及 submodule 升级?是否影响现有 slash 命令 / 配置格式?'
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 其他上下文
      description: '参考链接、同类终端工具的做法、截图'
    validations:
      required: false