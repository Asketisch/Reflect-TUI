# Reflect-TUI 持续集成。
#
# push / PR 触发,在 ubuntu + macOS 上跑 fmt / clippy / test。
# 注意:本仓库通过 `reflect-agent/` submodule 引用核心 crate,
# 必须递归 checkout submodule 才能编译。

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只给最小权限:读源码 + 写 cache。Release 由独立 workflow 处理。
permissions:
  contents: read

# 取消同分支前序冗余运行,节省 CI 资源。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          # Windows:移植期平台 —— 自身 windows 代码(windows_sys 依赖 /
          # windows_sandbox 模块 / ratatui fork 的 trait 缺口)尚未修齐
          # (~70 个编译错误,建仓起未绿过)。release.yml 仍产 Windows 包;
          # 测试保留跑但不阻塞合流,修齐后移除 experimental。
          - os: windows
            runner: windows-latest
            experimental: true
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: cargo test
        run: cargo test --workspace --locked --all-targets

  # 功能覆盖门禁:真二进制 + pty 的行为级断言 + CLI 参数矩阵 + 覆盖自审。
  #
  # 与上面的 fmt / clippy / test 分工:那三项守**编译面**,本 job 守
  # **行为面** —— 用户真的看到了什么、真的落了什么盘、每条 slash 命令
  # 的运行时结局是什么。
  #
  # 跳过 cargo test / clippy / fmt / doc(已由上面的 job 覆盖),只跑
  # 真正的功能覆盖,避免重复消耗 CI 时间。
  functional-suite:
    name: functional suite (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          # Windows:pty 行为断言尚未在 Windows 上验证(本仓库自身 windows
          # 代码尚未修齐)。保留跑但不阻塞合流。
          - os: windows
            runner: windows-latest
            experimental: true
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip pytest pyte

      - name: Build release binary
        run: cargo build --release -p reflect-tui --locked

      - name: Run functional suite
        run: ./tests/run_all.sh functional

      - name: Coverage audit
        run: python3 tests/tools/coverage_audit.py --strict